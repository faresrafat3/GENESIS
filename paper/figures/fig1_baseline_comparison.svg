<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="white"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">
    Figure 1: GPQA Diamond Accuracy Across Runs (20-question subset)
  </text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#666">
    Same model (gpt-oss-120b:free), same benchmark, different scaffolding
  </text>

  <!-- Y-axis -->
  <line x1="80" y1="90" x2="80" y2="420" stroke="black" stroke-width="1.5"/>
  <text x="30" y="255" text-anchor="middle" font-size="12" transform="rotate(-90 30 255)">
    Accuracy (%)
  </text>

  <!-- Y-axis labels + gridlines -->
  <g font-size="10" fill="#666">
    <text x="70" y="425" text-anchor="end">0</text>
    <text x="70" y="358" text-anchor="end">20</text>
    <text x="70" y="292" text-anchor="end">40</text>
    <text x="70" y="226" text-anchor="end">60</text>
    <text x="70" y="160" text-anchor="end">80</text>
    <text x="70" y="94" text-anchor="end">100</text>
  </g>
  <g stroke="#ddd" stroke-dasharray="2,2">
    <line x1="80" y1="358" x2="720" y2="358"/>
    <line x1="80" y1="292" x2="720" y2="292"/>
    <line x1="80" y1="226" x2="720" y2="226"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
  </g>

  <!-- Reference lines -->
  <line x1="80" y1="358" x2="720" y2="358" stroke="#999" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="725" y="362" font-size="10" fill="#999">random baseline (25%)</text>

  <line x1="80" y1="94" x2="720" y2="94" stroke="#0a6" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="725" y="98" font-size="10" fill="#0a6">official 80.1%</text>

  <!-- Bars -->
  <!-- Bar 1: run_53 pre-fix -->
  <g>
    <rect x="120" y="325" width="80" height="95" fill="#c33"/>
    <text x="160" y="440" text-anchor="middle" font-size="11">GENESIS</text>
    <text x="160" y="454" text-anchor="middle" font-size="10" fill="#666">pre-fix (run_53)</text>
    <text x="160" y="318" text-anchor="middle" font-size="13" font-weight="bold">30.3%</text>
  </g>

  <!-- Bar 2: smoke v1 gpt-oss -->
  <g>
    <rect x="240" y="210" width="80" height="210" fill="#e80"/>
    <text x="280" y="440" text-anchor="middle" font-size="11">Pure baseline</text>
    <text x="280" y="454" text-anchor="middle" font-size="10" fill="#666">v1 (weak parser)</text>
    <text x="280" y="204" text-anchor="middle" font-size="13" font-weight="bold">65.0%</text>
  </g>

  <!-- Bar 3: final pure baseline 75% -->
  <g>
    <rect x="360" y="177" width="80" height="243" fill="#2a7"/>
    <text x="400" y="440" text-anchor="middle" font-size="11">Pure baseline</text>
    <text x="400" y="454" text-anchor="middle" font-size="10" fill="#666">v2 (all fixes)</text>
    <text x="400" y="171" text-anchor="middle" font-size="13" font-weight="bold">75.0%</text>
  </g>

  <!-- Bar 4: GENESIS post-fix (predicted) -->
  <g>
    <rect x="480" y="177" width="80" height="243" fill="#39c" fill-opacity="0.4"
          stroke="#39c" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="520" y="440" text-anchor="middle" font-size="11">GENESIS</text>
    <text x="520" y="454" text-anchor="middle" font-size="10" fill="#666">post-fix (T1 pending)</text>
    <text x="520" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#39c">?</text>
  </g>

  <!-- Bar 5: official 80.1% -->
  <g>
    <rect x="600" y="161" width="80" height="259" fill="#0a6" fill-opacity="0.3"
          stroke="#0a6" stroke-width="1"/>
    <text x="640" y="440" text-anchor="middle" font-size="11">Official</text>
    <text x="640" y="454" text-anchor="middle" font-size="10" fill="#666">gpt-oss-120b (198q)</text>
    <text x="640" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#0a6">80.1%</text>
  </g>

  <!-- Delta annotations -->
  <path d="M 200 325 Q 300 300 358 220" stroke="#c33" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="270" y="298" font-size="11" fill="#c33" font-weight="bold">Δ = +45 pts</text>
  <text x="270" y="312" font-size="10" fill="#c33">scaffolding fixes</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c33"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="400" y="490" text-anchor="middle" font-size="10" fill="#666">
    Source: results/agent_smoke_test, results/run_gpt-oss-120b_20q. Full data: paper/data/all_runs_comparison.csv
  </text>
</svg>
